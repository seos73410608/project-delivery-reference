spring:
  datasource:
    url: ${PMIS_POSTGRESQL_TEST_URL:jdbc:postgresql://localhost:5432/pmis_test}
    username: ${PMIS_POSTGRESQL_TEST_USERNAME}
    password: ${PMIS_POSTGRESQL_TEST_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN