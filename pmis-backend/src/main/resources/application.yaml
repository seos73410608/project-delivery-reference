
spring:
  application:
    name: pmis

  profiles:
    default: dev,postgresql

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

runtime:
  api:
    base-url: ${RUNTIME_API_BASE_URL:http://127.0.0.1:8000}
    api-key: ${RUNTIME_API_KEY:}

server:
  port: ${SERVER_PORT:8765}

pmis:
  redis:
    enabled: ${PMIS_REDIS_ENABLED:false}
    host: ${PMIS_REDIS_HOST:127.0.0.1}
    port: ${PMIS_REDIS_PORT:6379}
    database: ${PMIS_REDIS_DATABASE:1}

  auth:
    login-attempt:
      ttl-seconds: ${PMIS_AUTH_LOGIN_ATTEMPT_TTL_SECONDS:300}