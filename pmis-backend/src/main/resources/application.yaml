spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/pmis
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: pmis

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  # 기존 JWT 설정 유지
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

runtime:
  api:
    base-url: ${RUNTIME_API_BASE_URL:http://127.0.0.1:8000}
    api-key: ${RUNTIME_API_KEY:sample-runtime-key-2026-dev-only}
