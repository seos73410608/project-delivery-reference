spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/pmis
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  application:
    name: pmis

jwt:
  # Base64 인코딩된 512bit Secret Key
  secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000