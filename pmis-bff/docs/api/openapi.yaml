openapi: 3.1.0

info:
  title: PMIS BFF API
  version: 1.0.0
  description: |
    PMIS Backend For Frontend API Specification.

    React Frontend와 Spring Boot Backend 사이에서
    브라우저 요청, 인증 쿠키, 사용자 세션 및 API 연계를 처리한다.

    본 명세는 현재 구현된 API 계약과 향후 구현할 목표 API 설계를
    함께 관리한다.

    x-implementation-status를 통해 현재 구현 상태를 구분한다.

servers:
  - url: http://localhost:4000
    description: Local Development Server

tags:
  - name: System
    description: BFF 시스템 상태 확인
  - name: Authentication
    description: 로그인 및 인증 상태 관리
  - name: Session
    description: 사용자 세션 조회 및 관리

security:
  - SessionCookie: []

paths:

  /health:
    get:
      tags:
        - System
      summary: BFF Health Check
      description: BFF 서버의 정상 동작 여부를 확인한다.
      operationId: getHealth
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: BFF 서버 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: pmis-bff

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: 로그인
      description: |
        사용자 인증을 수행한다.

        인증 성공 시 BFF 세션을 생성하고 인증 쿠키를 발급한다.

        최대 동시 세션 수를 초과하여 기존 세션 선택이 필요한 경우
        기존 세션을 자동 종료하지 않고 사용자에게 활성 세션 목록을 제공한다.

        세션 선택이 필요한 경우에도 HTTP 200을 반환하며,
        code는 SESSION_SELECTION_REQUIRED로 구분한다.

        실제 Backend 로그인 API:
        POST /api/auth/login
      operationId: login
      security: []
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공 또는 기존 세션 선택 필요
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSuccessResponse'
                  - $ref: '#/components/schemas/SessionSelectionRequiredResponse'
              examples:
                success:
                  summary: 로그인 성공
                  value:
                    success: true
                    code: SUCCESS
                    message: 로그인에 성공했습니다.
                    data:
                      user:
                        userId: 1
                        username: admin
                        name: 관리자
                        role: ADMIN
                sessionSelectionRequired:
                  summary: 기존 세션 선택 필요
                  value:
                    success: true
                    code: SESSION_SELECTION_REQUIRED
                    message: 로그인할 세션을 선택해야 합니다.
                    data:
                      status: SESSION_SELECTION_REQUIRED
                      loginAttemptId: login-attempt-value
                      requiredTerminationCount: 2
                      activeSessions:
                        - sessionId: 123e4567-e89b-12d3-a456-426614174000
                          createdAt: '2026-11-19T09:00:00'
                          lastAccessedAt: '2026-11-19T10:00:00'
        '400':
          description: 잘못된 로그인 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 사용자 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: BFF 세션 생성 실패 또는 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login/session-selection:
    post:
      tags:
        - Authentication
      summary: 세션 선택 후 로그인 완료
      description: |
        기존 세션 선택이 필요한 로그인 절차를 완료한다.

        사용자가 종료할 기존 세션 ID 목록을 전달한다.

        BFF는 Backend의 세션 선택 로그인 API를 호출한다.

        선택된 세션 종료 및 신규 세션 생성이 성공하면
        BFF 세션을 생성하고 인증 쿠키를 발급한다.

        추가 세션 선택이 필요한 경우 HTTP 200과
        SESSION_SELECTION_REQUIRED 응답을 반환한다.

        실제 Backend API:
        POST /api/auth/login/session-selection
      operationId: completeLogin
      security: []
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSelectionRequest'
      responses:
        '200':
          description: 로그인 완료 또는 추가 세션 선택 필요
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSuccessResponse'
                  - $ref: '#/components/schemas/SessionSelectionRequiredResponse'
              examples:
                success:
                  summary: 세션 선택 및 로그인 완료
                  value:
                    success: true
                    code: SUCCESS
                    message: 로그인에 성공했습니다.
                    data:
                      user:
                        userId: 1
                        username: admin
                        name: 관리자
                        role: ADMIN
                sessionSelectionRequired:
                  summary: 추가 세션 선택 필요
                  value:
                    success: true
                    code: SESSION_SELECTION_REQUIRED
                    message: 추가로 종료할 세션을 선택해야 합니다.
                    data:
                      status: SESSION_SELECTION_REQUIRED
                      loginAttemptId: login-attempt-value
                      requiredTerminationCount: 1
                      activeSessions: []
        '400':
          description: 잘못된 세션 선택 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 절차가 유효하지 않거나 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 세션 상태 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: 현재 로그인 사용자 조회
      description: |
        현재 인증된 사용자의 정보를 조회한다.

        브라우저는 BFF 인증 쿠키를 이용하여 요청한다.
        BFF는 현재 세션을 확인하고 사용자 정보를 반환한다.

        현재 미구현된 목표 API이다.
      operationId: getCurrentUser
      x-implementation-status: planned
      responses:
        '200':
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: 인증되지 않은 요청 또는 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: 인증 토큰 갱신
      description: |
        현재 BFF 세션에 연결된 Refresh Token을 이용하여
        Access Token과 Refresh Token을 갱신한다.

        Refresh Token은 브라우저에 노출하지 않는다.

        BFF는 서버 측 인증 정보를 이용하여
        Spring Boot Backend의 POST /api/auth/refresh를 호출한다.

        Backend API는 Request Body의 refreshToken을 사용하지만,
        BFF API는 브라우저에 Refresh Token을 노출하지 않는 것을 목표로 한다.

        갱신 성공 시 서버 측 토큰을 교체하고
        인증 세션 쿠키의 만료 시간을 갱신한다.

        현재 미구현된 목표 API이다.
      operationId: refreshAuthentication
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: 인증 토큰 갱신 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh Token 만료 또는 유효하지 않은 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: 로그아웃
      description: |
        현재 로그인한 BFF 세션을 종료한다.

        BFF 세션 및 서버 측 인증 정보를 정리하고
        브라우저 인증 쿠키를 만료 처리한다.

        Backend에는 현재 확인된 로그아웃 API가 없으므로
        Backend 토큰 폐기 연계 방식은 추후 확정한다.

        현재 미구현된 목표 API이다.
      operationId: logout
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: 인증되지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 세션 정리 실패 또는 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions:
    get:
      tags:
        - Session
      summary: 활성 세션 목록 조회
      description: |
        현재 사용자에게 연결된 활성 세션 목록을 조회한다.

        각 세션은 개별 식별자를 가지며
        사용자는 종료할 세션을 선택할 수 있다.

        현재 세션 여부를 구분하여 반환하는 것을 목표로 한다.

        Backend에는 별도의 세션 목록 조회 API가 아직 없으므로
        조회 데이터의 연계 방식과 BFF 세션 및 Backend 세션 간
        식별자 매핑 정책은 추후 확정한다.

        현재 미구현된 목표 API이다.
      operationId: getSessions
      x-implementation-status: planned
      responses:
        '200':
          description: 활성 세션 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: 인증되지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions/{sessionId}:
    delete:
      tags:
        - Session
      summary: 특정 세션 종료
      description: |
        현재 사용자에게 속한 지정 세션을 종료한다.

        다른 사용자의 세션은 종료할 수 없다.

        종료 대상 세션의 인증 정보를 폐기하고
        이후 해당 세션을 이용한 인증 요청을 거부한다.

        현재 로그인 중인 세션을 종료하는 경우에는
        인증 쿠키도 만료 처리한다.

        Backend에는 별도의 세션 종료 API가 아직 없으므로
        세션 종료 연계 방식과 세션 식별자 정책은 추후 확정한다.

        현재 미구현된 목표 API이다.
      operationId: terminateSession
      x-implementation-status: planned
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 종료할 세션 식별자
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: 세션 종료 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTerminateResponse'
        '401':
          description: 인증되지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF 검증 실패 또는 세션 접근 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 세션을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 세션 상태 변경 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  securitySchemes:

    SessionCookie:
      type: apiKey
      in: cookie
      name: pmis_session
      description: |
        BFF가 발급하는 인증 세션 쿠키.

        HttpOnly 및 SameSite=Lax 속성을 적용한다.
        Secure 속성은 운영 환경에서 활성화한다.

  parameters:

    OriginHeader:
      name: Origin
      in: header
      required: true
      description: |
        요청을 발생시킨 Frontend Origin.

        목표 보안 정책으로 정의하며,
        현재 BFF에서는 명시적인 Origin 검증을 수행하지 않는다.
      schema:
        type: string
        format: uri
      example: http://localhost:5173

    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        상태 변경 요청 검증을 위한 CSRF Token.

        CSRF Token 발급 및 검증 방식은 아직 구현되지 않았으며
        목표 보안 정책으로 정의한다.
      schema:
        type: string
      example: csrf-token-value

  headers:

    SessionCookie:
      description: |
        인증 세션 쿠키.

        HttpOnly, SameSite=Lax, Path=/ 속성을 적용한다.
        Secure 속성은 운영 환경에서 적용한다.
      schema:
        type: string
      example: pmis_session=session-value; HttpOnly; SameSite=Lax; Path=/

    ClearedSessionCookie:
      description: 인증 세션 쿠키 만료
      schema:
        type: string
      example: pmis_session=; HttpOnly; SameSite=Lax; Path=/; Max-Age=0

  schemas:

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - UP
          example: UP
        service:
          type: string
          example: pmis-bff

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          description: 사용자 로그인 ID
          example: admin
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: 사용자 비밀번호

    SessionSelectionRequest:
      type: object
      additionalProperties: false
      required:
        - loginAttemptId
        - sessionIds
      properties:
        loginAttemptId:
          type: string
          minLength: 1
          description: |
            세션 선택이 필요한 로그인 요청의 임시 로그인 절차 식별자.
            UUID 형식은 강제하지 않는다.
        sessionIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: 사용자가 종료하기로 선택한 기존 세션 ID 목록
          items:
            type: string
            format: uuid

    LoginSuccessResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
          example: true
        code:
          type: string
          const: SUCCESS
          example: SUCCESS
        message:
          type: string
          example: 로그인에 성공했습니다.
        data:
          type: object
          required:
            - user
          properties:
            user:
              $ref: '#/components/schemas/User'

    SessionSelectionRequiredResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
          example: true
        code:
          type: string
          const: SESSION_SELECTION_REQUIRED
          example: SESSION_SELECTION_REQUIRED
        message:
          type: string
          example: 로그인할 세션을 선택해야 합니다.
        data:
          type: object
          required:
            - status
            - loginAttemptId
            - requiredTerminationCount
            - activeSessions
          properties:
            status:
              type: string
              const: SESSION_SELECTION_REQUIRED
            loginAttemptId:
              type: string
              minLength: 1
              description: 임시 로그인 절차 식별자
            requiredTerminationCount:
              type: integer
              minimum: 1
              description: 종료해야 하는 기존 세션 수
            activeSessions:
              type: array
              description: 사용자가 종료 대상을 선택할 수 있는 활성 세션 목록
              items:
                $ref: '#/components/schemas/ActiveSession'

    ActiveSession:
      type: object
      required:
        - sessionId
        - createdAt
        - lastAccessedAt
      properties:
        sessionId:
          type: string
          format: uuid
          description: Backend 세션 식별자
        createdAt:
          type: string
          description: 세션 생성 일시
          example: '2026-11-19T09:00:00'
        lastAccessedAt:
          type: string
          description: 마지막 접근 일시
          example: '2026-11-19T10:00:00'

    CurrentUserResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
        data:
          $ref: '#/components/schemas/User'

    RefreshResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: 토큰이 재발급되었습니다.

    LogoutResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: 로그아웃이 완료되었습니다.

    SessionListResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: 세션 목록 조회가 완료되었습니다.
        data:
          type: object
          required:
            - maxSessionCount
            - activeSessionCount
            - sessions
          properties:
            maxSessionCount:
              type: integer
              minimum: 1
              description: 사용자별 최대 동시 세션 수
            activeSessionCount:
              type: integer
              minimum: 0
              description: 현재 활성 세션 수
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/Session'

    SessionTerminateResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: 세션이 종료되었습니다.
        data:
          type: object
          required:
            - sessionId
            - status
          properties:
            sessionId:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - TERMINATED
              example: TERMINATED

    User:
      type: object
      required:
        - userId
        - username
        - name
        - role
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        name:
          type: string
          example: 관리자
        role:
          type: string
          example: ADMIN

    Session:
      type: object
      required:
        - sessionId
        - createdAt
        - lastAccessedAt
        - current
      properties:
        sessionId:
          type: string
          format: uuid
          description: 세션 고유 식별자
        createdAt:
          type: string
          format: date-time
          description: 세션 생성 일시
        lastAccessedAt:
          type: string
          format: date-time
          description: 마지막 접근 일시
        current:
          type: boolean
          description: 현재 브라우저에서 사용 중인 세션 여부
        ipAddress:
          type: string
          description: 접속 IP 주소
        userAgent:
          type: string
          description: 브라우저 및 접속 환경 정보
        status:
          type: string
          enum:
            - ACTIVE
            - TERMINATED
            - EXPIRED
          example: ACTIVE

    ErrorResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          const: false
          example: false
        code:
          type: string
          example: AUTHENTICATION_FAILED
        message:
          type: string
          example: 요청을 처리할 수 없습니다.