openapi: 3.1.0

info:
  title: PMIS BFF API
  version: 1.0.0
  description: |
    PMIS Backend For Frontend API Specification.

    React Frontend와 Spring Boot Backend 사이에서
    브라우저 요청, 인증 쿠키, 사용자 세션 및 API 연계를 처리한다.

    본 명세는 목표 API 설계 초안이며 실제 구현 과정에서
    Backend API 계약 및 인증 정책에 따라 변경될 수 있다.

servers:
  - url: http://localhost:4000
    description: Local Development Server

tags:
  - name: System
    description: BFF 시스템 상태 확인
  - name: Authentication
    description: 로그인 및 인증 상태 관리
  - name: Session
    description: 사용자 세션 조회 및 관리

security:
  - SessionCookie: []

paths:

  /health:
    get:
      tags:
        - System
      summary: BFF Health Check
      description: BFF 서버의 정상 동작 여부를 확인한다.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: BFF 서버 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: pmis-bff

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: 로그인
      description: |
        사용자 인증을 수행한다.

        인증 성공 후 활성 세션 수를 확인한다.

        최대 동시 세션 수를 초과하지 않는 경우
        신규 세션을 생성하고 인증 쿠키를 발급한다.

        최대 세션 수를 초과하는 경우 기존 세션을
        자동 종료하지 않고 사용자에게 활성 세션 목록을 제공한다.

        세션 선택이 필요한 경우 HTTP 409와
        SESSION_LIMIT_REACHED 응답을 반환한다.
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: 잘못된 로그인 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 사용자 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 최대 세션 수 초과로 사용자 선택 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLimitResponse'
        '429':
          description: 로그인 요청 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login/complete:
    post:
      tags:
        - Authentication
      summary: 세션 선택 후 로그인 완료
      description: |
        최대 동시 세션 수 초과로 로그인 절차가 보류된 경우 사용한다.

        사용자가 종료할 기존 세션을 선택하여 전달한다.

        BFF와 Backend는 다음 항목을 검증해야 한다.

        - 로그인 시 발급된 임시 인증 절차의 유효성
        - 임시 인증 절차의 만료 여부
        - 선택된 세션이 해당 사용자의 세션인지 여부
        - 선택된 세션이 여전히 활성 상태인지 여부
        - 선택 후 신규 세션 생성이 최대 세션 수를 초과하지 않는지 여부

        선택된 세션 폐기가 성공한 후 신규 세션을 생성한다.

        로그인 완료 시 인증 쿠키를 발급한다.
      operationId: completeLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCompleteRequest'
      responses:
        '200':
          description: 로그인 완료
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: 잘못된 세션 선택 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 임시 로그인 인증 절차가 유효하지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 세션 상태 변경 또는 동시 로그인 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 임시 로그인 인증 절차 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: 현재 로그인 사용자 조회
      description: |
        현재 인증된 사용자의 정보를 조회한다.

        브라우저는 인증 쿠키를 이용하여 요청한다.
        BFF는 현재 세션을 확인하고 사용자 정보를 반환한다.
      operationId: getCurrentUser
      responses:
        '200':
          description: 사용자 정보 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: 인증되지 않은 요청 또는 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: 인증 토큰 갱신
      description: |
        현재 세션에 연결된 인증 정보를 이용하여
        Access Token을 갱신한다.

        Refresh Token은 브라우저에 노출하지 않는다.

        BFF가 서버 측 인증 정보를 이용하여
        Spring Boot Backend와 토큰 갱신을 수행한다.
      operationId: refreshAuthentication
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: 인증 토큰 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Refresh Token 만료 또는 유효하지 않은 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: 로그아웃
      description: |
        현재 로그인한 세션을 종료한다.

        BFF는 Backend에 현재 세션의 인증 정보 폐기를 요청한다.

        세션 폐기 결과를 확인한 후 BFF의 인증 정보를 정리하고
        브라우저 인증 쿠키를 만료 처리한다.
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: 인증되지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 세션 폐기 실패 또는 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions:
    get:
      tags:
        - Session
      summary: 활성 세션 목록 조회
      description: |
        현재 사용자에게 연결된 활성 세션 목록을 조회한다.

        각 세션은 개별 식별자를 가지며
        사용자는 종료할 세션을 선택할 수 있다.

        현재 세션 여부를 구분하여 반환한다.
      operationId: getSessions
      responses:
        '200':
          description: 활성 세션 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          description: 인증되지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions/{sessionId}:
    delete:
      tags:
        - Session
      summary: 특정 세션 종료
      description: |
        현재 사용자에게 속한 지정 세션을 종료한다.

        다른 사용자의 세션은 종료할 수 없다.

        종료 대상 세션의 인증 정보를 폐기하고
        이후 해당 세션을 이용한 인증 요청을 거부한다.

        현재 로그인 중인 세션을 종료하는 경우에는
        로그아웃 처리와 동일한 인증 쿠키 정리 정책을 적용한다.
      operationId: terminateSession
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 종료할 세션 식별자
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: 세션 종료 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTerminateResponse'
        '401':
          description: 인증되지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF 검증 실패 또는 세션 접근 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 세션을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 세션 상태 변경 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  securitySchemes:

    SessionCookie:
      type: apiKey
      in: cookie
      name: pmis_session
      description: |
        BFF가 발급하는 인증 세션 쿠키.

        HttpOnly 및 Secure 속성을 적용한다.
        실제 쿠키 속성은 환경별 보안 정책에 따라 결정한다.

  parameters:

    OriginHeader:
      name: Origin
      in: header
      required: true
      description: 요청을 발생시킨 Frontend Origin
      schema:
        type: string
        format: uri
      example: http://localhost:5173

    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: 상태 변경 요청 검증을 위한 CSRF Token
      schema:
        type: string
      example: csrf-token-value

  headers:

    SessionCookie:
      description: |
        인증 세션 쿠키.

        실제 운영 환경에서는 Secure, HttpOnly,
        SameSite 및 Path 정책을 적용한다.
      schema:
        type: string
      example: pmis_session=session-value; HttpOnly; Secure; SameSite=Lax; Path=/

    ClearedSessionCookie:
      description: 인증 세션 쿠키 만료
      schema:
        type: string
      example: pmis_session=; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=0

  schemas:

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - UP
          example: UP
        service:
          type: string
          example: pmis-bff

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: 사용자 로그인 ID
          example: admin
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: 사용자 비밀번호

    LoginSuccessResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: LOGIN_SUCCESS
        message:
          type: string
          example: 로그인이 완료되었습니다.
        data:
          $ref: '#/components/schemas/LoginData'

    LoginData:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'

    LoginCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - loginAttemptId
        - terminateSessionIds
      properties:
        loginAttemptId:
          type: string
          format: uuid
          description: |
            세션 선택이 필요한 로그인 요청에 대해
            BFF가 발급한 임시 로그인 절차 식별자
        terminateSessionIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: 사용자가 종료하기로 선택한 기존 세션 ID 목록
          items:
            type: string
            format: uuid

    SessionLimitResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          enum:
            - SESSION_LIMIT_REACHED
          example: SESSION_LIMIT_REACHED
        message:
          type: string
          example: 최대 동시 세션 수를 초과했습니다. 종료할 세션을 선택해 주세요.
        data:
          type: object
          required:
            - loginAttemptId
            - maxSessionCount
            - activeSessionCount
            - sessions
          properties:
            loginAttemptId:
              type: string
              format: uuid
              description: 임시 로그인 절차 식별자
            maxSessionCount:
              type: integer
              minimum: 1
              description: 사용자별 최대 동시 세션 수
            activeSessionCount:
              type: integer
              minimum: 0
              description: 현재 활성 세션 수
            sessions:
              type: array
              description: 사용자가 종료 대상을 선택할 수 있는 활성 세션 목록
              items:
                $ref: '#/components/schemas/Session'

    CurrentUserResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: USER_INFO_SUCCESS
        message:
          type: string
          example: 사용자 정보 조회가 완료되었습니다.
        data:
          $ref: '#/components/schemas/User'

    RefreshResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: TOKEN_REFRESH_SUCCESS
        message:
          type: string
          example: 인증 정보가 갱신되었습니다.

    LogoutResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: LOGOUT_SUCCESS
        message:
          type: string
          example: 로그아웃이 완료되었습니다.

    SessionListResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: SESSION_LIST_SUCCESS
        message:
          type: string
          example: 세션 목록 조회가 완료되었습니다.
        data:
          type: object
          required:
            - maxSessionCount
            - activeSessionCount
            - sessions
          properties:
            maxSessionCount:
              type: integer
              minimum: 1
              description: 사용자별 최대 동시 세션 수
            activeSessionCount:
              type: integer
              minimum: 0
              description: 현재 활성 세션 수
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/Session'

    SessionTerminateResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: SESSION_TERMINATED
        message:
          type: string
          example: 세션이 종료되었습니다.
        data:
          type: object
          required:
            - sessionId
            - status
          properties:
            sessionId:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - TERMINATED
              example: TERMINATED

    User:
      type: object
      required:
        - userId
        - username
        - name
        - role
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        name:
          type: string
          example: 관리자
        role:
          type: string
          example: ADMIN

    Session:
      type: object
      required:
        - sessionId
        - createdAt
        - lastAccessedAt
        - current
      properties:
        sessionId:
          type: string
          format: uuid
          description: 세션 고유 식별자
        createdAt:
          type: string
          format: date-time
          description: 세션 생성 일시
        lastAccessedAt:
          type: string
          format: date-time
          description: 마지막 접근 일시
        current:
          type: boolean
          description: 현재 브라우저에서 사용 중인 세션 여부
        ipAddress:
          type: string
          description: 접속 IP 주소
          example: 192.168.0.10
        userAgent:
          type: string
          description: 브라우저 및 접속 환경 정보
          example: Chrome on Windows
        status:
          type: string
          enum:
            - ACTIVE
            - TERMINATED
            - EXPIRED
          example: ACTIVE

    ErrorResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: AUTHENTICATION_FAILED
        message:
          type: string
          example: 요청을 처리할 수 없습니다.
        data:
          type:
            - object
            - 'null'
          nullable: true
          description: 오류 상세 데이터
        timestamp:
          type: string
          format: date-time
          description: 오류 발생 시각
        traceId:
          type: string
          description: 서버 로그 추적 ID
          example: 8f7a6d5c-1234-4567-8901-abcdef123456
